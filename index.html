  <style>
    :root {
      --bg: #05070a;
      --card-bg: rgba(15, 22, 36, 0.75);
      --accent-blue: #00f2fe;
      --accent-cyan: #4facfe;
      --accent-purple: #7b2cbf;
      --accent-glow: rgba(0, 242, 254, 0.25);
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(0, 242, 254, 0.35);
      --discord: #5865F2;
      --active-color: #22c55e;
      --inactive-color: #ef4444;
      --urgent-color: #f97316;
      --sale-color: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% -10%, rgba(0, 242, 254, 0.18), transparent 50%),
        radial-gradient(circle at 100% 60%, rgba(123, 44, 191, 0.12), transparent 40%),
        radial-gradient(circle at 0% 100%, rgba(79, 172, 254, 0.08), transparent 40%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .top-bar {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 15px;
    }

    .lang-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px;
      gap: 4px;
      backdrop-filter: blur(10px);
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 15px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      color: #000;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      width: 100%;
    }

    .brand-title {
      font-size: clamp(2.4rem, 9vw, 3.8rem);
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, #00f2fe 50%, #9d4edd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(0, 242, 254, 0.25);
      text-transform: uppercase;
      user-select: none;
    }

    header p {
      color: var(--text-dim);
      margin-top: 8px;
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      padding: 0 10px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.02);
      padding: 6px;
      border-radius: 25px;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 800px;
      backdrop-filter: blur(10px);
    }

    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      border-radius: 18px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #000;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    .price-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .price-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .price-card:hover {
      border-color: var(--border-hover);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
    }

    .price-card h3 {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 15px;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .price-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      background: rgba(255, 255, 255, 0.015);
      border-radius: 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .price-item:last-child {
      margin-bottom: 0;
    }

    .price-item:hover {
      background: rgba(0, 242, 254, 0.08);
      border-color: rgba(0, 242, 254, 0.3);
      transform: translateY(-2px);
    }

    .price-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .count-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-count {
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .sale-badge {
      background: rgba(234, 179, 8, 0.15);
      color: var(--sale-color);
      border: 1px solid rgba(234, 179, 8, 0.3);
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .status-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .item-status {
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .item-status.active { color: var(--active-color); }
    .item-status.inactive { color: var(--inactive-color); }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }

    .item-status.active .status-dot {
      background-color: var(--active-color);
      box-shadow: 0 0 6px var(--active-color);
    }

    .item-status.inactive .status-dot {
      background-color: var(--inactive-color);
    }

    .price-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .old-price {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-decoration: line-through;
    }

    .item-price {
      font-weight: 800;
      color: var(--accent-blue);
      font-size: 1.1rem;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-contact {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-discord {
      background: rgba(88, 101, 242, 0.12);
      color: #7983f5;
      border: 1px solid rgba(88, 101, 242, 0.3);
    }

    .btn-discord:hover, .btn-discord:active {
      background: var(--discord);
      color: #fff;
      box-shadow: 0 0 15px rgba(88, 101, 242, 0.4);
    }

    .btn-insta {
      background: rgba(225, 48, 108, 0.12);
      color: #ff6b9d;
      border: 1px solid rgba(225, 48, 108, 0.3);
    }

    .btn-insta:hover, .btn-insta:active {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff;
      box-shadow: 0 0 15px rgba(225, 48, 108, 0.4);
    }

    .platform-block {
      display: none;
    }

    .platform-block.active {
      display: block;
    }

    /* Модальное окно (Оверлей + Карточка слота) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 10, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      background: rgba(18, 26, 43, 0.95);
      border: 1px solid var(--border-hover);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px var(--accent-glow);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .modal-header {
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 5px;
    }

    .modal-price-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 10px;
    }

    .modal-price {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent-blue);
    }

    .modal-old-price {
      font-size: 1rem;
      color: var(--text-dim);
      text-decoration: line-through;
    }

    .modal-desc {
      font-size: 0.95rem;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.02);
      padding: 15px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .modal-contact-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    footer {
      margin-top: auto;
      padding: 25px 0 10px;
      color: var(--text-dim);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      body { padding: 12px 10px; }
      .tabs { border-radius: 18px; }
      .tab-btn { flex: 1 1 40%; padding: 8px 10px; font-size: 0.8rem; }
      .price-card { padding: 18px; }
      .modal-card { padding: 22px; }
    }
  </style>
</head>

      document.getElementById('modal-overlay').classList.add('active');
    }

    function closeModal(e) {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    function renderPlatform(platform) {
      const grid = document.getElementById(`grid-${platform}`);
      grid.innerHTML = '';

      SERVICES_DATA[platform].forEach(cat => {
        const title = translations[currentLang][cat.key];
        
        let itemsHTML = cat.items.map(item => `
          <div class="price-item" onclick='openModal(${JSON.stringify(item)}, "${title}")'>
            <div class="price-info">
              <div class="count-row">
                <span class="item-count">${item.count}</span>
                ${item.sale ? `<span class="sale-badge">${translations[currentLang].sale}</span>` : ''}
              </div>
              <div class="status-group">
                <span class="item-status ${item.active ? 'active' : 'inactive'}">
                  <span class="status-dot"></span>
                  ${item.active ? translations[currentLang].active : translations[currentLang].inactive}
                </span>
              </div>
            </div>
            <div class="price-block">
              ${item.oldPrice ? `<span class="old-price">${item.oldPrice}</span>` : ''}
              <span class="item-price">${item.price}</span>
            </div>
          </div>
        `).join('');

        const card = document.createElement('div');
        card.className = 'price-card';
        card.innerHTML = `
          <div>
            <h3>${title}</h3>
            <div>${itemsHTML}</div>
          </div>
          <div class="action-buttons">
            <a href="https://discord.gg/твой_сервер" target="_blank" class="btn-contact btn-discord">Discord</a>
            <a href="https://www.instagram.com/gafurov12478/" target="_blank" class="btn-contact btn-insta">Instagram</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('subtitle').innerText = translations[lang].subtitle;
      document.getElementById('footer-text').innerText = translations[lang].footer;
      document.getElementById('m-contact-title').innerText = translations[lang].contactTitle;

      document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      ['telegram', 'crypto', 'instagram', 'tiktok'].forEach(renderPlatform);
    }

    function switchTab(e, platform) {
      document.querySelectorAll('.platform-block').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(platform).classList.add('active');
      e.currentTarget.classList.add('active');
    }

    setLanguage(currentLang);
  </script>
</body>
</html>
