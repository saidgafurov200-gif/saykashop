<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAYKASHOP — SMM Services</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23090a0f'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='%2300f2fe' font-family='Arial, sans-serif' font-weight='900' font-size='65'>S</text></svg>">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(22, 27, 38, 0.6);
      --accent-blue: #00f2fe;
      --accent-purple: #9d4edd;
      --accent-glow: rgba(0, 242, 254, 0.4);
      --text: #ffffff;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --discord: #5865F2;
      --active-color: #4ade80;
      --inactive-color: #ef4444;
      --urgent-color: #f87171;
      --sale-color: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.15), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(157, 78, 221, 0.1), transparent 40%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .top-bar {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .lang-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px;
      gap: 4px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 15px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background: var(--accent-blue);
      color: #000;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
      width: 100%;
    }

    .brand-title {
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #9d4edd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
      text-transform: uppercase;
      user-select: none;
    }

    header p {
      color: var(--text-dim);
      margin-top: 8px;
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      padding: 0 10px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.03);
      padding: 5px;
      border-radius: 40px;
      border: 1px solid var(--border);
      width: 100%;
      max-width: 400px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      text-align: center;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #000;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .container {
      width: 100%;
      max-width: 1000px;
    }

    .price-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .price-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
    }

    .price-card:hover {
      border-color: rgba(0, 242, 254, 0.3);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 242, 254, 0.15);
    }

    .price-card h3 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }

    .price-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
    }

    .price-item:last-child {
      border-bottom: none;
    }

    .price-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .count-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-count {
      color: #fff;
      font-weight: 600;
    }

    .sale-badge {
      background: rgba(245, 158, 11, 0.15);
      color: var(--sale-color);
      border: 1px solid rgba(245, 158, 11, 0.4);
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .status-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .item-status {
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .item-status.active { color: var(--active-color); }
    .item-status.inactive { color: var(--inactive-color); }

    .urgent-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--urgent-color);
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(239, 68, 68, 0.1);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }

    .item-status.active .status-dot {
      background-color: var(--active-color);
      box-shadow: 0 0 6px var(--active-color);
    }

    .item-status.inactive .status-dot {
      background-color: var(--inactive-color);
    }

    .urgent-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--urgent-color);
      box-shadow: 0 0 6px var(--urgent-color);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .price-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .old-price {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-decoration: line-through;
    }

    .item-price {
      font-weight: 700;
      color: var(--accent-blue);
      font-size: 1.05rem;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-contact {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-discord {
      background: rgba(88, 101, 242, 0.15);
      color: #7983f5;
      border: 1px solid rgba(88, 101, 242, 0.4);
    }

    .btn-discord:active, .btn-discord:hover {
      background: var(--discord);
      color: #fff;
    }

    .btn-insta {
      background: rgba(225, 48, 108, 0.15);
      color: #ff6b9d;
      border: 1px solid rgba(225, 48, 108, 0.4);
    }

    .btn-insta:active, .btn-insta:hover {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #fff;
    }

    .platform-block {
      display: none;
    }

    .platform-block.active {
      display: block;
    }

    footer {
      margin-top: auto;
      padding: 20px 0 10px;
      color: var(--text-dim);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px 10px;
      }

      .price-card {
        padding: 16px;
      }

      .action-buttons {
        flex-direction: row;
      }

      .btn-contact {
        padding: 14px 10px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="lang-switch">
      <button class="lang-btn active" id="btn-ru" onclick="setLanguage('ru')">RU</button>
      <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
    </div>
  </div>

  <header>
    <div class="brand-title">SAYKASHOP</div>
    <p id="subtitle">Быстрая и качественная накрутка социальных сетей</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(event, 'instagram')">Instagram</button>
    <button class="tab-btn" onclick="switchTab(event, 'tiktok')">TikTok</button>
  </div>

  <div class="container">
    <div id="instagram" class="platform-block active">
      <div class="price-grid" id="grid-instagram"></div>
    </div>
    <div id="tiktok" class="platform-block">
      <div class="price-grid" id="grid-tiktok"></div>
    </div>
  </div>

  <footer>
    <p>© SAYKASHOP — <span id="footer-text">Все права защищены</span></p>
  </footer>

  <script>
    const SERVICES_DATA = {
      instagram: [
        {
          key: "followers",
          items: [
            { count: "1 000", price: "$0.99", oldPrice: "", active: true, sale: false, urgent: false },
            { count: "10 000", price: "$8.09", oldPrice: "$8.99", active: true, sale: true, urgent: true },
            { count: "100 000", price: "$39.99", oldPrice: "", active: false, sale: false, urgent: false },
            { count: "1 000 000", price: "$99.99", oldPrice: "", active: false, sale: false, urgent: false }
          ]
        },
        {
          key: "views",
          items: [
            { count: "1 000", price: "$0.29", oldPrice: "", active: true, sale: false, urgent: false },
            { count: "10 000", price: "$2.69", oldPrice: "$2.99", active: true, sale: true, urgent: true },
            { count: "100 000", price: "$19.99", oldPrice: "", active: false, sale: false, urgent: false },
            { count: "1 000 000", price: "$59.99", oldPrice: "", active: false, sale: false, urgent: false }
          ]
        },
        {
          key: "likes",
          items: [
            { count: "1 000", price: "$0.59", oldPrice: "", active: true, sale: false, urgent: false },
            { count: "10 000", price: "$6.29", oldPrice: "$6.99", active: true, sale: true, urgent: true },
            { count: "100 000", price: "$32.99", oldPrice: "", active: false, sale: false, urgent: false },
            { count: "1 000 000", price: "$74.99", oldPrice: "", active: false, sale: false, urgent: false }
          ]
        }
      ],
      tiktok: [
        {
          key: "followers",
          items: [
            { count: "1 000", price: "$2.29", oldPrice: "", active: true, sale: false, urgent: false },
            { count: "10 000", price: "$13.49", oldPrice: "$14.99", active: true, sale: true, urgent: true },
            { count: "100 000", price: "$69.99", oldPrice: "", active: false, sale: false, urgent: false },
            { count: "1 000 000", price: "$139.99", oldPrice: "", active: false, sale: false, urgent: false }
          ]
        },
        {
          key: "views",
          items: [
            { count: "1 000", price: "$0.25", oldPrice: "", active: true, sale: false, urgent: false },
            { count: "10 000", price: "$1.79", oldPrice: "$1.99", active: true, sale: true, urgent: true },
            { count: "100 000", price: "$14.99", oldPrice: "", active: false, sale: false, urgent: false },
            { count: "1 000 000", price: "$49.99", oldPrice: "", active: false, sale: false, urgent: false }
          ]
        },
        {
          key: "likes",
          items: [
            { count: "1 000", price: "$1.09", oldPrice: "", active: true, sale: false, urgent: false },
            { count: "10 000", price: "$8.99", oldPrice: "$9.99", active: true, sale: true, urgent: true },
            { count: "100 000", price: "$42.99", oldPrice: "", active: false, sale: false, urgent: false },
            { count: "1 000 000", price: "$114.99", oldPrice: "", active: false, sale: false, urgent: false }
          ]
        }
      ]
    };

    const translations = {
      ru: {
        subtitle: "Быстрая и качественная накрутка социальных сетей",
        followers: "Подписчики",
        views: "Просмотры",
        likes: "Лайки",
        footer: "Все права защищены",
        active: "Активно",
        inactive: "Неактивно",
        runningOut: "Заканчиваются",
        sale: "Акция -10%"
      },
      en: {
        subtitle: "Fast and high-quality social media promotion",
        followers: "Followers",
        views: "Views",
        likes: "Likes",
        footer: "All rights reserved",
        active: "Active",
        inactive: "Inactive",
        runningOut: "Running out",
        sale: "Sale -10%"
      }
    };

    let currentLang = 'ru';

    function renderPlatform(platform) {
      const grid = document.getElementById(`grid-${platform}`);
      grid.innerHTML = '';

      SERVICES_DATA[platform].forEach(cat => {
        const title = translations[currentLang][cat.key];
        
        let itemsHTML = cat.items.map(item => `
          <div class="price-item">
            <div class="price-info">
              <div class="count-row">
                <span class="item-count">${item.count}</span>
                ${item.sale ? `<span class="sale-badge">${translations[currentLang].sale}</span>` : ''}
              </div>
              <div class="status-group">
                <span class="item-status ${item.active ? 'active' : 'inactive'}">
                  <span class="status-dot"></span>
                  ${item.active ? translations[currentLang].active : translations[currentLang].inactive}
                </span>
                ${item.urgent ? `
                  <span class="urgent-badge">
                    <span class="urgent-dot"></span>
                    ${translations[currentLang].runningOut}
                  </span>
                ` : ''}
              </div>
            </div>
            <div class="price-block">
              ${item.oldPrice ? `<span class="old-price">${item.oldPrice}</span>` : ''}
              <span class="item-price">${item.price}</span>
            </div>
          </div>
        `).join('');

        const card = document.createElement('div');
        card.className = 'price-card';
        card.innerHTML = `
          <div>
            <h3>${title}</h3>
            <div>${itemsHTML}</div>
          </div>
          <div class="action-buttons">
            <a href="https://discord.gg/твой_сервер" target="_blank" class="btn-contact btn-discord">Discord</a>
            <a href="https://www.instagram.com/gafurov12478/" target="_blank" class="btn-contact btn-insta">Instagram</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('subtitle').innerText = translations[lang].subtitle;
      document.getElementById('footer-text').innerText = translations[lang].footer;

      document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      renderPlatform('instagram');
      renderPlatform('tiktok');
    }

    function switchTab(e, platform) {
      document.querySelectorAll('.platform-block').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(platform).classList.add('active');
      e.currentTarget.classList.add('active');
    }

    setLanguage(currentLang);
  </script>
</body>
</html>
